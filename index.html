<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOREF - Professional Services</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="logo.png" alt="SOREF Logo">
        </div>
        <nav>
            <ul>
                <li><a href="#services">Services</a></li>
                <li><a href="#gallery">Gallery</a></li>
                <li><a href="#contact">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    
    <main>
        <section id="services">
            <h2>Our Services</h2>
            <p>Description of the services offered by SOREF.</p>
        </section>
        
        <section id="gallery">
            <h2>Gallery</h2>
            <div class="gallery-container">
                <img src="gallery1.jpg" alt="Gallery Image 1">
                <img src="gallery2.jpg" alt="Gallery Image 2">
                <img src="gallery3.jpg" alt="Gallery Image 3">
            </div>
        </section>
        
        <section id="contact">
            <h2>Request a Quote</h2>
            <form action="mailto:your-email@example.com" method="post" enctype="text/plain">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                
                <label for="message">Message:</label>
                <textarea id="message" name="message" required></textarea>
                
                <input type="submit" value="Send">
            </form>
        </section>
    </main>
    
    <footer>
        <p>&copy; 2026 SOREF. All rights reserved.</p>
    </footer>
</body>
</html>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #f4f4f4;
}
header {
    background: linear-gradient(to right, #ff0000, #0000ff);
    color: white;
    padding: 1em;
    text-align: center;
}
nav ul {
    list-style: none;
    padding: 0;
}
nav ul li {
    display: inline;
    margin: 0 15px;
}
nav ul li a {
    color: white;
    text-decoration: none;
}
main {
    padding: 20px;
}
section {
    margin-bottom: 20px;
}
.gallery-container {
    display: flex;
    gap: 10px;
}
footer {
    text-align: center;
    padding: 10px;
    background: #333;
    color: white;
}
@media (max-width: 600px) {
    nav ul li {
        display: block;
        margin: 10px 0;
    }
    .gallery-container {
        flex-direction: column;
    }
}
</style>
